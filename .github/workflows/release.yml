name: Release Management

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    name: Create Release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setting@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build release
        run: pnpm build
      - name: Generate changelog
        run: |
          echo "# Release ${{ steps.version.outputs.version }}" > CHANGELOG_RELEASE.md
          echo "" >> CHANGELOG_RELEASE.md
          git log --oneline $(git describe --tags --abbrev=0 @^)..@ >> CHANGELOG_RELEASE.md || echo "First release" >> CHANGELOG_RELEASE.md
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: Release ${{ steps.version.outputs.version }}
          body_path: CHANGELOG_RELEASE.md
          draft: false
          prerelease: false
